; re5_char_tweaks - global settings
;
; All keys are snake_case; a missing key keeps its default value.
; Character (costume) table:  re5_ct_characters.ini
; Weapon table:              re5_ct_weapons.ini
; Per-mod overrides:         re5_char_overrides\, re5_weapon_overrides\
; Loose file overrides:      re5_file_overrides\<archive path>.<ext>

[settings]
; 1 = files from re5_file_overrides\ override the matching .arc entries,
;     0 = disable the file-override hooks
file_overrides=1

; 1 = only resource types the game can load are indexed (mod, mtg, tex,
;     lmt, chn, ccl, efl, ...); previews, backups and source files are
;     skipped and listed in the log. 0 = index every file.
file_override_whitelist=1

; extra extensions to accept, comma separated (e.g. "abc,def")
file_override_exts=

; how long to wait before patching code (the retail exe is Enigma-protected;
; patching earlier makes the game exit with "Program integrity check failed")
delay_ms=10000

; 1 = write %TEMP%\re5_weapon_offsets.txt with the runtime weapon table (0 = off)
dump_weapons=0
