; RE5 per-costume tweaks (re5_char_tweaks.asi)
;
; Sections are exact class names (costumes), not characters. Every key that is
; not set in a class section falls back to [default].
;
; Overrides for mods: put <class>.ini files into re5_char_overrides\
; (next to the .asi). Example: re5_char_overrides\uPl00ChrisCos3.ini
; with plain keys (no section header needed):
;     back=0
;     custom_bone=1
;     bone=4
;
; back:         -1 = vanilla, 0 = never mount, 1 = force mount
; custom_bone:  0/1 - use the joint below for the mount
; bone:         0..127 - anim joint No
; chn:          0 = off, 1 = .chn, 2 = .ccl, 3 = both
;
; Class list (costumes):
;   Chris : uPl00ChrisNormal, ArmorA/B/F, Plain, Cos1..4, Ep1
;   Sheva : uPl01ShebaNormal, ArmorA/B/F, Plain, Cos1..4
;   Jill  : uPl02JillCos1..4
;   Wesker: uPl03WeskerCos1..2
;   Josh  : uPl04JoshCos1..2
;   Excella: uPl05ExcellaNormal
;   Barry : uPl06BarryNormal
;   Rebecca: uPl07RebeccaNormal

[default]
back=-1
custom_bone=0
bone=0
chn=0

